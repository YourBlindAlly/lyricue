name: Build preview iOS ipa

# Builds "CueMe Preview" — same app, but with a different bundle identifier
# (com.rustyperez.cueme.preview) and display name than the real app
# (see app.config.js's APP_VARIANT handling). Installing this alongside the
# real app gives it a completely separate local storage sandbox, so a fresh
# install / first-launch experience (onboarding, demo song seeding) can be
# tried out with zero risk to the real app's library, setlists, or settings.
# Manually triggered only — this isn't part of the normal release pipeline.

on:
  workflow_dispatch: {}

env:
  CI: true
  APP_VARIANT: preview

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - name: Install JS dependencies
        run: npm ci

      # Same secret-injection pattern as the real build workflow — see its
      # own comment for why this is never committed directly.
      - name: Inject AI search backend config
        run: |
          sed -i '' "s|export const AI_SEARCH_BACKEND_URL = '';|export const AI_SEARCH_BACKEND_URL = '${{ secrets.AI_SEARCH_BACKEND_URL }}';|" src/aiSearch/config.ts
          sed -i '' "s|export const AI_SEARCH_APP_SECRET = '';|export const AI_SEARCH_APP_SECRET = '${{ secrets.AI_SEARCH_APP_SECRET }}';|" src/aiSearch/config.ts

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --non-interactive

      - name: Find workspace and scheme
        id: find
        run: |
          workspace=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n1)
          # Querying the WORKSPACE lists every CocoaPods sub-target's scheme
          # too (including this project's own native pedal module), so
          # taking schemes[0] there depends on alphabetical luck — confirmed
          # broken live 2026-09-04 when this picked "CuemePedalInput"
          # instead of the app itself for a differently-named build variant.
          # Querying the main .xcodeproj directly (it lives right under
          # ios/, unlike Pods' own project which is nested under ios/Pods/)
          # only ever lists the real app's own scheme.
          project=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n1)
          scheme=$(xcodebuild -list -project "$project" -json | \
            node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8')); console.log(d.project.schemes[0]);")
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Found workspace: $workspace, scheme: $scheme"

      - name: Archive (code signing disabled)
        run: |
          xcodebuild archive \
            -workspace "${{ steps.find.outputs.workspace }}" \
            -scheme "${{ steps.find.outputs.scheme }}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CueMePreview.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned ipa
        run: |
          app_path=$(find build/CueMePreview.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -n1)
          mkdir -p Payload
          cp -r "$app_path" Payload/
          zip -r LyriCue-Preview-unsigned.ipa Payload
          echo "Built: $(ls -la LyriCue-Preview-unsigned.ipa)"

      - uses: actions/upload-artifact@v4
        with:
          name: LyriCue-Preview-unsigned-ipa
          path: LyriCue-Preview-unsigned.ipa
          retention-days: 30

      # Separate rolling release from the real app's "latest-build" so the
      # two never overwrite each other.
      - name: Publish to the rolling "latest-preview-build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-preview-build --yes --repo "${{ github.repository }}" || true
          git tag -f latest-preview-build
          git push -f origin latest-preview-build
          gh release create latest-preview-build LyriCue-Preview-unsigned.ipa \
            --repo "${{ github.repository }}" \
            --title "Latest preview build" \
            --notes "Automatically published from commit ${{ github.sha }}. Separate bundle ID (com.rustyperez.cueme.preview) from the real app — installs side by side with its own storage, for trying out fresh-install behavior safely. Unsigned — install via SideStore/SideInstaller/iLoader like the real app." \
            --latest=false
